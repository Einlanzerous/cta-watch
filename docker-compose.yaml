# Local full-stack bring-up for cta-watch.
#
# Build context is the repo root for both images (npm-workspaces monorepo with a
# single root lockfile); each service points at its own workspace Dockerfile.
#
#   docker compose up --build
#   open http://localhost:4000
#
# In the construct-server stack the server is reached internally over the docker
# network (the client's nginx proxies /api -> server:3001), so it deliberately
# publishes no host port here — host 3001 is taken by uptime-kuma. Uncomment the
# server `ports` block below only if you want to hit the API directly in dev.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: cta-watch-server
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/cta-watch.db
      # No CTA_API_KEY -> the server boots in MOCK MODE. Set both to go live:
      - MOCK_MODE=${MOCK_MODE:-true}
      - CTA_API_KEY=${CTA_API_KEY:-}
    volumes:
      - cta-data:/app/data
    # ports:
    #   - "3001:3001"   # optional: direct API access for local debugging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cta-watch-client
    environment:
      - BACKEND_HOST=server
    ports:
      - "4000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cta-data:
