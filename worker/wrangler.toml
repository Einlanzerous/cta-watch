# CTA Watch — Cloudflare Worker (API + static client + cron jobs)
#
# One Worker serves everything:
#   - /api/*            → Hono routes backed by D1
#   - everything else   → built Vue client from ../client/dist (SPA fallback)
#   - cron triggers     → on-time poll, nightly prune, weekly ridership sync

name = "cta-watch"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# Static assets: build the client first (npm run build --workspace=client).
# run_worker_first keeps /api/* out of the SPA fallback.
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /__scheduled is the local cron test endpoint (wrangler dev --test-scheduled);
# in production it falls through to the API's JSON 404.
run_worker_first = ["/api/*", "/__scheduled"]

# Cron Triggers fire in UTC. Chicago is UTC-5 (CDT) / UTC-6 (CST).
#   */5 * * * *  → on-time poll (service-hours guard lives in code, Chicago-aware)
#   0 9 * * *    → prune records >1 year old (~03:00–04:00 Chicago)
#   0 12 * * 1   → Monday ridership sync (~06:00–07:00 Chicago)
[triggers]
crons = ["*/5 * * * *", "0 9 * * *", "0 12 * * 1"]

# Create the database with:  wrangler d1 create cta-watch
# then paste the returned id below. Local dev (wrangler dev / --local) does not
# need a real id — it uses a local SQLite file keyed by database_name.
[[d1_databases]]
binding = "DB"
database_name = "cta-watch"
database_id = "7b5e5a70-d372-470c-a98d-73b31985dbc0"

[vars]
# "true" forces mock data. Mock mode also auto-enables when CTA_API_KEY is unset.
MOCK_MODE = "false"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   CTA_API_KEY  — CTA Train Tracker API key; absent → mock mode
#   ADMIN_TOKEN  — bearer token gating PATCH /api/fleet/:line and
#                  POST /api/fleet/reseed; absent → those endpoints are disabled

[observability]
enabled = true
